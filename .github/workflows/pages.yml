name: Deploy AI Learning Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/configure-pages@v5
      - name: Validate update scripts
        run: |
          node --check site-update.js
          node --check account-learning.js
          node --check public-auth.js
      - name: Validate formula rendering
        run: |
          node tests/math-notation.cjs
          node scripts/test-formula-guides.cjs
      - name: Validate experiment record recovery
        run: node tests/lab-record-recovery.cjs
      - name: Validate site navigation and restored location
        run: |
          node tests/navigation.cjs
          node scripts/test-learning-location.cjs
      - name: Validate Google login and session isolation
        run: |
          node scripts/test-login-account-choice.cjs
          node tests/auth-session-switch.cjs
      - name: Validate Python code runner
        run: |
          node --check python-runner.js
          node tests/python-runner.cjs
      - name: Validate iPAS video and chapter mappings
        run: |
          node tests/ipas-video-map.cjs
          node tests/ipas-resources.cjs
          node tests/ipas-lifecycle.cjs
      - name: Stamp release and version assets
        run: python3 .github/scripts/build-release.py
      - name: Name Pages artifact
        id: package
        run: echo "artifact_name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: ${{ steps.package.outputs.artifact_name }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
