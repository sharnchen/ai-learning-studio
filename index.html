const selector="#app pre, #lesson-content pre, #keyword-content pre, #lab-content pre";
function language(code,s){const m=code.className.match(/(?:language|lang)-([\w+#-]+)/i);if(m)return m[1];if(/^\s*(?:from \w+ import|import \w+|def \w+|#.*\n|ckpt = torch|torch\.|model\.)/m.test(s))return "Python";if(/\b(?:const|let|function)\s+\w+/.test(s))return "JavaScript";return "Code";}
function enhance(){document.querySelectorAll(selector).forEach(pre=>{if(pre.closest(".studio-code-card"))return;const code=pre.querySelector("code")||pre,s=code.textContent;if(!s.trim())return;const card=document.createElement("div");card.className="studio-code-card";const head=document.createElement("div");head.className="studio-code-head";const label=document.createElement("span");label.textContent="‹/›  "+language(code,s);const btn=document.createElement("button");btn.type="button";btn.textContent="複製";btn.setAttribute("aria-label","複製程式碼");btn.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(s);btn.textContent="已複製";}catch{btn.textContent="複製失敗";}setTimeout(()=>btn.textContent="複製",1800)});head.append(label,btn);pre.before(card);card.append(head,pre);if(!code.children.length){const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#[^\n]*|\/\/[^\n]*|\b(?:def|class|import|from|return|if|else|elif|for|while|in|with|as|break|continue|const|let|function|True|False|None|true|false|null)\b|\b\d+(?:\.\d+)?\b)/g;let pos=0;const frag=document.createDocumentFragment();for(const m of s.matchAll(re)){frag.append(document.createTextNode(s.slice(pos,m.index)));const span=document.createElement("span");span.className="studio-token-"+(/^(#|\/\/)/.test(m[0])?"comment":/^['"]/.test(m[0])?"string":/^\d/.test(m[0])?"number":"keyword");span.textContent=m[0];frag.append(span);pos=m.index+m[0].length}frag.append(document.createTextNode(s.slice(pos)));code.replaceChildren(frag)}})}
let queued=false;function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;enhance()})}function init(){enhance();new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
